<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="sidebar">
    <div class="logo">
        <h1>NUNSIS</h1>
        <h2>Student Portal</h2>
    </div>

    <div class="menu">
        <a href="/student_dashboard">🏠 Dashboard</a>
        <a href="/edit_student_own_profile">👤 My Profile</a>
        <a href="/logout">🚪 Logout</a>
    </div>
</div>

<div class="main">

    <div class="topbar">
        <h2>My Profile</h2>
        <h3>Hi, {{ session.get("fullname", session.get("username")) }}</h3>
    </div>

    <div class="card">
        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" value="{{ student['Student ID'] }}" readonly>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" value="{{ student['Full Name'] }}" readonly>
                </div>

                <div class="form-group">
                    <label>Grade Level</label>
                    <input type="text" value="{{ student['Grade Level'] }}" readonly>
                </div>

                <div class="form-group">
                    <label>Sport</label>
                    <input type="text" value="{{ student['Sports Events'] }}" readonly>
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text"
                           name="contact_number"
                           value="{{ show_value(student.get('Contact Number')) }}">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email"
                           name="email"
                           value="{{ show_value(student.get('Email')) }}">
                </div>

            </div>

            <div class="form-actions">
                <button class="btn" type="submit">Save Changes</button>
                <a href="/student_dashboard" class="btn secondary-btn">Back</a>
            </div>

        </form>
    </div>

</div>

</body>
</html>
