<!DOCTYPE html>
<html>
<head>
    <title>Promote Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="sidebar">
    <div class="logo">
        <h1>NUNSIS</h1>
        <h2>Athletes' Academic Development Office</h2>
    </div>

    <div class="menu">
        <a href="/">🏠 Dashboard</a>
        <a href="/student_list">👥 Student List</a>
        <a href="/add_student">➕ Add New Student</a>
        <a href="/grades">📘 Grades</a>
        <a href="/reports">📊 Reports</a>
        <a href="/promote_students">⬆️ Promote Students</a>
        <a href="/logout">🚪 Logout</a>
    </div>
</div>

<div class="main">

    <div class="topbar">
        <h2>Promote Students</h2>
        <h3>Hi, {{ session.get("username", "User") }}</h3>
    </div>

    <div class="card">
        <h2>Promote Academic Year</h2>

        <form method="POST">
            <div class="form-grid">

                <div class="form-group">
                    <label>Old Academic Year</label>
                    <input type="text" name="old_academic_year" placeholder="2025-2026" required>
                </div>

                <div class="form-group">
                    <label>New Academic Year</label>
                    <input type="text" name="new_academic_year" placeholder="2026-2027" required>
                </div>

            </div>

            <div class="form-actions">
                <button class="btn" type="submit">
                    Promote Students
                </button>
            </div>
        </form>
    </div>

</div>

</body>
</html>
