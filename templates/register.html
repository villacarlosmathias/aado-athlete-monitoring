<form method="POST">

    <input type="text"
           name="fullname"
           placeholder="Full Name"
           required>

    <input type="text"
           name="position"
           placeholder="Position"
           required>

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <select name="role" required>
        <option value="">Select Role</option>

        <option value="admin_jhs_shs">
            JHS / SHS Admin
        </option>

        <option value="admin_college">
            College Admin
        </option>
    </select>

    <button type="submit">
        Register
    </button>

</form>
