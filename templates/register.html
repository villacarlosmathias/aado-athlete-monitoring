<!DOCTYPE html>
<html>
<head>
    <title>Register Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

<div class="login-container">

    <div class="login-card">

        <h1>AADO Monitoring</h1>
        <p class="subtitle">Register New Account</p>

        {% if error %}
            <div class="login-error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div style="background:#e8f5e9; color:#2e7d32; padding:10px; border-radius:10px; margin-bottom:15px;">
                {{ success }}
            </div>
        {% endif %}

        <form method="POST">

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <select name="role" required>
                <option value="">Select Account Type</option>
                <option value="admin_jhs_shs">Admin - JHS / SHS</option>
                <option value="admin_college">Admin - College</option>
                <option value="assistant">Assistant Encoder</option>
            </select>

            <button type="submit">Register</button>

        </form>

        <p style="margin-top:20px;">
            Already have an account?
            <a href="/login">Login here</a>
        </p>

    </div>

</div>

</body>
</html>
