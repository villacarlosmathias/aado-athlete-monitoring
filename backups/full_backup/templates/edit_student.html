<!DOCTYPE html>
<html>
<head>
    <title>Edit Student Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="sidebar">
    <div class="logo">
        <h1>NUNSIS</h1>
        <h2>Athletes' Academic Development Office</h2>
    </div>

    <div class="menu">
        <a href="/">🏠 Dashboard</a>
        <a href="/student_list">👥 Student List</a>
        <a href="/add_student">➕ Add Student</a>
        <a href="/reports">📊 Reports</a>
        <a href="/logout">🚪 Logout</a>
    </div>
</div>

<div class="main">

    <div class="topbar">
        <h2>Edit Student Profile</h2>
        <h3>Hi, {{ session.get("fullname", session.get("username", "User")) }}</h3>
    </div>

    <div class="card">

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" value="{{ student['Student ID'] }}" readonly>
                </div>

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="full_name" value="{{ show_value(student.get('Full Name')) }}" required>
                </div>

                <div class="form-group">
                    <label>Grade Level</label>
                    <select name="grade_level" required>
                        {% set current_grade = show_value(student.get('Grade Level')) %}

                        {% for grade in ["Grade 7", "Grade 8", "Grade 9", "Grade 10", "Grade 11", "Grade 12", "College"] %}
                            <option value="{{ grade }}" {% if current_grade == grade %}selected{% endif %}>
                                {{ grade }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Section</label>
                    <input type="text" name="section" value="{{ show_value(student.get('Section')) }}">
                </div>

                <div class="form-group">
                    <label>Strand</label>
                    <input type="text" name="strand" value="{{ show_value(student.get('Strand')) }}">
                </div>

                <div class="form-group">
                    <label>Year Level</label>
                    <select name="year_level">
                        {% set current_year = show_value(student.get('Year Level')) %}

                        <option value="">N/A</option>
                        {% for year in ["1st Year", "2nd Year", "3rd Year", "4th Year"] %}
                            <option value="{{ year }}" {% if current_year == year %}selected{% endif %}>
                                {{ year }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Course / Program</label>
                    <input type="text" name="course_program" value="{{ show_value(student.get('Course / Program')) }}">
                </div>

                <div class="form-group">
                    <label>College</label>
                    <input type="text" name="college" value="{{ show_value(student.get('College')) }}">
                </div>

                <div class="form-group">
                    <label>Sport</label>
                    <input type="text" name="sport" value="{{ show_value(student.get('Sports Events')) }}" required>
                </div>

            </div>

            <div class="form-actions">
                <button class="btn" type="submit">
                    Save Changes
                </button>

                <a href="/student_list" class="btn secondary-btn">
                    Back
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
